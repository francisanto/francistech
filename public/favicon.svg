<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bracketL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bracketR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Squircle container -->
  <rect x="8" y="8" width="496" height="496" rx="124" fill="url(#bgGrad)"/>
  <rect x="18" y="18" width="476" height="476" rx="114" fill="none" stroke="url(#borderGrad)" stroke-width="20" stroke-opacity="0.95"/>

  <!-- Left Bracket < -->
  <path d="M 132 184 L 56 256 L 132 328" fill="none" stroke="url(#bracketL)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Bracket > -->
  <path d="M 380 184 L 456 256 L 380 328" fill="none" stroke="url(#bracketR)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Centered FA Monogram -->
  <text x="256" y="318" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Space Grotesk', system-ui, sans-serif" 
        font-size="188" 
        font-weight="900" 
        text-anchor="middle" 
        fill="#ffffff" 
        letter-spacing="-6">FA</text>
</svg>
